{% extends "manager_base.html" %}
{% block title %}Parametri{% endblock %}
{% block content %}
<h1>Parametri sistema</h1>

<div class="card" style="max-width: 480px;">
    <form method="POST" action="/manager/parameters">
        <div class="field" style="margin-bottom: 10px;">
            <label>Težina udaljenosti do restorana</label>
            <input type="number" step="0.01" name="weight_distance_to_restaurant" value="{{ params.weight_distance_to_restaurant or 0.5 }}" required>
        </div>
        <div class="field" style="margin-bottom: 10px;">
            <label>Težina udaljenosti rute</label>
            <input type="number" step="0.01" name="weight_distance_route" value="{{ params.weight_distance_route or 0.5 }}" required>
        </div>
        <div class="field" style="margin-bottom: 10px;">
            <label>Kapacitet bicikla</label>
            <input type="number" step="1" name="capacity_bicycle" value="{{ params.capacity_bicycle or 3 }}" required>
        </div>
        <div class="field" style="margin-bottom: 10px;">
            <label>Kapacitet skutera / motora</label>
            <input type="number" step="1" name="capacity_scooter" value="{{ params.capacity_scooter or 6 }}" required>
        </div>
        <div class="field" style="margin-bottom: 14px;">
            <label>Kapacitet automobila</label>
            <input type="number" step="1" name="capacity_car" value="{{ params.capacity_car or 15 }}" required>
        </div>
        <button type="submit">Sačuvaj parametre</button>
    </form>
</div>
{% endblock %}
