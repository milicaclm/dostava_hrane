<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dostavljači</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            /* Osnovni, čitljiv font */
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            /* Centriran naslov gore */
            margin-bottom: 40px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            /* Gura pretragu skroz levo, a dugme skroz desno */
            align-items: center;
            margin-bottom: 15px;
        }

        .search-box {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .search-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-advanced {
            padding: 10px 15px;
            background-color: #007bff;
            /* Plava boja za naprednu pretragu */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-advanced:hover {
            background-color: #0056b3;
        }

        .btn-add {
            padding: 10px 20px;
            background-color: #28a745;
            /* Zelena boja za akciju dodavanja */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-add:hover {
            background-color: #218838;
        }

        .btn-edit {
            padding: 5px 10px;
            background-color: #ffc107;
            color: black;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-edit:hover { background-color: #e0a800; }

        .btn-delete {
            padding: 5px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-delete:hover { background-color: #c82333; }

        table {
            width: 100%;
            border-collapse: collapse;
            /* Spaja ivice ćelija */
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            /* Blago siva pozadina zaglavlja tabele */
            font-weight: bold;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable::after {
            content: '\2195';
            /* Neutralna strelica (gore-dole) */
            margin-left: 5px;
            opacity: 0.3;
        }

        th.sortable.asc::after {
            content: '\2191';
            /* Strelica nagore */
            opacity: 1;
        }

        th.sortable.desc::after {
            content: '\2193';
            /* Strelica nadole */
            opacity: 1;
        }

        th.sortable:hover {
            background-color: #e2e6ea;
        }

        tr:hover {
            background-color: #f1f1f1;
            /* Hover efekat prilikom prelaska miša preko reda */
        }

        /* Stilovi za Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            width: 450px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label { display: block; margin-bottom: 2px; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <h1>Dostavljači</h1>

    <div class="controls">
        <div class="search-group">
            <input type="text" class="search-box" placeholder="Pretraži dostavljače...">
            <button class="btn-advanced">Napredna pretraga</button>
        </div>
        <button class="btn-add" onclick="openAddModal()">+ Dodaj dostavljača</button>
    </div>

    <table>
        <thead>
            <tr>
                <th class="sortable">ID</th>
                <th class="sortable">Ime</th>
                <th class="sortable">Prezime</th>
                <th class="sortable">Email</th>
                <th class="sortable">Telefon</th>
                <th class="sortable">Aktivan</th>
                <th class="sortable" title="Klikni za sortiranje">Dozvola (Motor)</th>
                <th class="sortable" title="Klikni za sortiranje">Dozvola (Auto)</th>
                <th class="sortable">Plata (RSD)</th>
                <th class="sortable">Ocena</th>
                <th>Akcije</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dinamički podaci iz baze -->
        </tbody>
    </table>

    <!-- Modal za dodavanje/izmenu dostavljača -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div id="modalTitle" class="modal-header">Novi dostavljač</div>
            <div class="form-group">
                <label>ID:</label>
                <input type="text" id="add-id" placeholder="user-del-5">
            </div>
            <div class="form-group">
                <label>Ime:</label>
                <input type="text" id="add-name">
            </div>
            <div class="form-group">
                <label>Prezime:</label>
                <input type="text" id="add-surname">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="add-email">
            </div>
            <div class="form-group">
                <label>Telefon:</label>
                <input type="text" id="add-phone">
            </div>
            <div class="form-group">
                <label>Plata:</label>
                <input type="number" id="add-salary">
            </div>
            <div class="form-group" style="display: flex; gap: 20px; margin-top: 10px;">
                <label style="display: flex; gap: 5px; align-items: center;">
                    <input type="checkbox" id="add-moto" style="width: auto;"> Motor dozvola
                </label>
                <label style="display: flex; gap: 5px; align-items: center;">
                    <input type="checkbox" id="add-car" style="width: auto;"> Auto dozvola
                </label>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                <button class="btn-edit" onclick="closeModal()">Otkaži</button>
                <button class="btn-add" onclick="submitCourier()">Sačuvaj</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_COURIERS = 'http://localhost:8000/api/delivery-subsystem/resources/couriers';

        let isEditMode = false;

        async function loadCouriers() {
            try {
                const response = await fetch(API_BASE_COURIERS);
                const data = await response.json();
                const tbody = document.querySelector('tbody');
                tbody.innerHTML = '';
                
                if (data.couriers) {
                    data.couriers.forEach(courier => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${courier.id}</td>
                            <td>${courier.name}</td>
                            <td>${courier.surname}</td>
                            <td>${courier.email}</td>
                            <td>${courier.phone_number}</td>
                            <td>${courier.is_active ? 'Da' : 'Ne'}</td>
                            <td>${courier.motorcycle_license ? 'Da' : 'Ne'}</td>
                            <td>${courier.car_license ? 'Da' : 'Ne'}</td>
                            <td>${courier.salary}</td>
                            <td>${courier.average_rating}</td>
                            <td>
                                <button class="btn-edit" onclick="editCourier('${courier.id}')">Izmeni</button>
                                <button class="btn-delete" onclick="deleteCourier('${courier.id}')">Obriši</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Greška pri učitavanju dostavljača:', error);
            }
        }

        function openAddModal() {
            isEditMode = false;
            document.getElementById('modalTitle').innerText = 'Novi dostavljač';
            document.getElementById('add-id').value = '';
            document.getElementById('add-id').readOnly = false;
            document.getElementById('add-name').value = '';
            document.getElementById('add-surname').value = '';
            document.getElementById('add-email').value = '';
            document.getElementById('add-phone').value = '';
            document.getElementById('add-salary').value = '';
            document.getElementById('add-moto').checked = false;
            document.getElementById('add-car').checked = false;
            document.getElementById('addModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        async function submitCourier() {
            const id = document.getElementById('add-id').value;
            if (!id) return;
            const url = isEditMode ? `${API_BASE_COURIERS}/${id}/update` : API_BASE_COURIERS;
            const method = isEditMode ? 'PUT' : 'POST';
            const payload = {
                id, 
                name: document.getElementById('add-name').value,
                surname: document.getElementById('add-surname').value,
                email: document.getElementById('add-email').value,
                phone_number: document.getElementById('add-phone').value,
                salary: parseFloat(document.getElementById('add-salary').value) || 0,
                motorcycle_license: document.getElementById('add-moto').checked,
                car_license: document.getElementById('add-car').checked,
                is_active: true,
                password: 'pass'
            };

            try {
                await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                closeModal();
                loadCouriers();
            } catch (e) { console.error(e); }
        }

        async function deleteCourier(id) {
            if (!confirm('Da li ste sigurni da želite da obrišete ovog dostavljača?')) return;
            try {
                await fetch(`${API_BASE_COURIERS}/${id}`, { method: 'DELETE' });
                loadCouriers();
            } catch (e) { console.error(e); }
        }

        async function editCourier(id) {
            isEditMode = true;
            try {
                const resp = await fetch(API_BASE_COURIERS);
                const data = await resp.json();
                const c = data.couriers.find(x => x.id === id);
                if (!c) return;
                document.getElementById('modalTitle').innerText = 'Izmena dostavljača';
                document.getElementById('add-id').value = c.id;
                document.getElementById('add-id').readOnly = true;
                document.getElementById('add-name').value = c.name || '';
                document.getElementById('add-surname').value = c.surname || '';
                document.getElementById('add-email').value = c.email || '';
                document.getElementById('add-phone').value = c.phone_number || '';
                document.getElementById('add-salary').value = c.salary || 0;
                document.getElementById('add-moto').checked = c.motorcycle_license || false;
                document.getElementById('add-car').checked = c.car_license || false;
                document.getElementById('addModal').style.display = 'block';
            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCouriers(); // Učitavanje podataka odmah po otvaranju stranice
            
            document.querySelectorAll('th.sortable').forEach(th => {
                let asc = true;
                th.addEventListener('click', () => {
                    const table = th.closest('table');
                    const tbody = table.querySelector('tbody');
                    const index = Array.from(th.parentNode.children).indexOf(th);

                    // Resetovanje indikatora na ostalim kolonama
                    table.querySelectorAll('th.sortable').forEach(header => {
                        if (header !== th) header.classList.remove('asc', 'desc');
                    });

                    // Postavljanje indikatora na trenutnoj koloni
                    if (asc) {
                        th.classList.remove('desc');
                        th.classList.add('asc');
                    } else {
                        th.classList.remove('asc');
                        th.classList.add('desc');
                    }

                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    rows.sort((a, b) => {
                        const valA = a.children[index].innerText.trim();
                        const valB = b.children[index].innerText.trim();

                        // Provera da li je broj
                        if (!isNaN(valA) && !isNaN(valB) && valA !== '' && valB !== '') {
                            return asc ? valA - valB : valB - valA;
                        } else {
                            return asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                        }
                    });

                    asc = !asc;
                    rows.forEach(tr => tbody.appendChild(tr));
                });
            });
        });
    </script>
</body>

</html>
