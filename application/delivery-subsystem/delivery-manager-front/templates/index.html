<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Početna stranica</title>
    <!-- Povezivanje CSS fajla -->
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            /* Zauzima punu visinu ekrana */
        }

        .sidebar {
            flex: 1;
            /* Zauzima 1 deo prostora */
            background-color: #f4f4f4;
            /* Blaga pozadina radi lakšeg uočavanja */
            padding: 40px;


            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Razdvaja navigaciju i profil na vrh i dno */
        }

        .main-content {
            flex: 5;
            /* Zauzima 5 delova prostora */
            padding: 20px;
            display: flex;
            /* Dodato da bi iframe zauzeo punu visinu kontejnera */
        }

        iframe[name="content-frame"] {
            flex: 1;
            /* Zauzima sav preostali prostor u desnom delu */
            border: none;
            /* Uklanja podrazumevani okvir (border) oko iframe-a */
            width: 100%;
        }



        nav ul {
            list-style-type: none;
            /* Uklanja tačkice sa liste */
            padding: 0;
            margin: 0;
            margin-top: 30px;
        }

        nav li {
            margin-bottom: 15px;
            /* Razmak između linkova */
        }

        nav a {
            text-decoration: none;
            /* Uklanja podvlaku sa linkova */
            color: #333;
            font-size: 16px;
            display: block;
            /* Osigurava da svaki link zauzme ceo red u svom bloku */
        }

        nav a:hover {
            color: #007bff;
            /* Boja linka prilikom prelaska mišem */
        }

        .user-profile-wrapper {
            padding-top: 20px;
            border-top: 1px solid #ddd;
            /* Diskretna linija koja odvaja meni od profila */
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
        }

        .user-profile-details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            /* Pravi okruglu sliku */
            object-fit: cover;
        }

        .user-name {
            font-weight: bold;
            color: #333;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-email {
            font-size: 12px;
            color: #777;
        }

        .dropdown-trigger {
            cursor: pointer;
            padding: 5px;
            font-weight: bold;
            font-size: 16px;
            color: #555;
            user-select: none;
        }

        .dropdown-trigger:hover {
            color: #007bff;
        }

        .logout-dropdown {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
        }

        .btn-logout {
            width: 100%;
            padding: 8px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-logout:hover {
            background-color: #c82333;
        }
    </style>
</head>

<body>
    <!-- Levi div za navigaciju (razmera 1) -->
    <div class="sidebar">
        <!-- Ovde će se kasnije pozivati navigacija -->
        <nav>
            <ul>
                <li><a href="dostavljaci.html" target="content-frame">Dostavljači</a></li>
                <li><a href="dostave.html" target="content-frame">Dostave</a></li>
                <li><a href="vozila.html" target="content-frame">Vozila</a></li>
                <li><a href="parametri.html" target="content-frame">Parametri</a></li>
            </ul>
        </nav>

        <!-- Deo za korisnički profil na dnu -->
        <div class="user-profile-wrapper">
            <div class="user-profile">
                <div class="user-profile-details">
                    <img src="https://via.placeholder.com/40" alt="Slika profila" class="profile-pic">
                    <div class="user-info">
                        <span class="user-name" id="mgr-name">Učitavanje...</span>
                        <span class="user-email" id="mgr-email">...</span>
                    </div>
                </div>
                <span class="dropdown-trigger" onclick="toggleLogoutDropdown()">&#9662;</span>
            </div>
            <div class="logout-dropdown" id="logout-dropdown" style="display: none;">
                <button onclick="logout()" class="btn-logout">Odjavi se</button>
            </div>
        </div>
    </div>

    <!-- Desni div gde se nalazi stranica (razmera 5) -->
    <div class="main-content">
        <!-- Iframe po defaultu uvozi dostavljaci.html -->
        <iframe src="dostavljaci.html" name="content-frame" title="Glavni sadržaj"></iframe>
    </div>

    <script>
        function toggleLogoutDropdown() {
            const dropdown = document.getElementById('logout-dropdown');
            if (dropdown.style.display === 'none') {
                dropdown.style.display = 'block';
            } else {
                dropdown.style.display = 'none';
            }
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            window.location.href = '/';
        }

        function getUserIdFromToken(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                const payload = JSON.parse(jsonPayload);
                return payload.sub;
            } catch (e) {
                console.error("Greška pri dekodiranju tokena:", e);
                return null;
            }
        }

        async function loadManagerProfile() {
            const token = localStorage.getItem('jwt_token');
            if (!token) {
                console.error("Nema JWT tokena.");
                return;
            }
            const userId = getUserIdFromToken(token);
            if (!userId) return;

            try {
                const response = await fetch(`/api/delivery-subsystem/users/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('mgr-name').innerText = `${user.name} ${user.surname}`;
                    document.getElementById('mgr-email').innerText = user.email;
                } else {
                    console.error("Neuspelo učitavanje profila menadžera.");
                }
            } catch (e) {
                console.error("Greška pri dohvatanju profila:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadManagerProfile();
        });
    </script>
</body>

</html>
