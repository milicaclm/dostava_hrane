<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kurir Panel{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; color: #000; background: #fff; }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid #000; background: #f8f8f8; }
        .topbar nav { display: flex; gap: 8px; }
        .topbar a, .btn, button { padding: 6px 12px; border: 1px solid #000; background: #fff; color: #000; text-decoration: none; cursor: pointer; font-size: 0.9rem; display: inline-block; }
        .topbar a.active, .topbar a:hover, .btn:hover, button:hover { background: #eee; font-weight: bold; }
        .main { max-width: 960px; margin: 20px auto; padding: 0 16px; }
        h1, h2 { margin-top: 0; }
        .card { border: 1px solid #000; padding: 14px; margin-bottom: 16px; background: #fafafa; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .field label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 3px; }
        .field input, .field select, input, select { padding: 6px 8px; border: 1px solid #000; font-size: 0.9rem; width: 100%; }
        .row input { width: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
        th { background: #eee; }
        .badge { display: inline-block; padding: 4px 10px; border: 1px solid #000; font-weight: bold; margin-bottom: 12px; }
        .badge.on { background: #dfd; }
        .badge.off { background: #fdd; }
        .err { color: #b00; font-weight: bold; margin-bottom: 10px; }
        .ok { color: #060; font-weight: bold; margin-bottom: 10px; }
        form.inline { display: inline; }
    </style>
</head>
<body>
    <header class="topbar">
        <nav>
            <a href="/courier/smena" class="{{ 'active' if active_page == 'smena' }}">Smena</a>
            <a href="/courier/moja-vozila" class="{{ 'active' if active_page == 'moja_vozila' }}">Moja vozila</a>
        </nav>
        <a href="/logout">Odjavi se</a>
    </header>
    <main class="main">
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        {% if message %}<div class="ok">{{ message }}</div>{% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
