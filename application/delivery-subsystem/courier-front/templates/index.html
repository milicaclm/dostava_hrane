<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurir Panel</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; }
        .top-bar { padding: 10px; border-bottom: 1px solid #ccc; background: #eee; }
        button, a { margin-right: 10px; text-decoration: none; padding: 5px 10px; cursor: pointer; color: black; background: #fff; border: 1px solid #ccc; }
        button:hover, a:hover { background: #ddd; }
        .main-content { flex-grow: 1; display: flex; }
        iframe { flex-grow: 1; border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="moja_vozila.html" target="content-frame">Moja Vozila</a>
        <button onclick="logout()">Odjavi se</button>
    </div>
    <div class="main-content">
        <iframe src="smena.html" name="content-frame"></iframe>
    </div>
    <script>
        function logout() {
            localStorage.removeItem('jwt_token');
            window.location.href = '/';
        }
    </script>
</body>
</html>
