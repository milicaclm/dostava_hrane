<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smena - Dostavljač</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: monospace;
            color: #000000;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border: 2px solid #000000;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #000000;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #000000;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border: 2px solid #000000;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .status-badge.off {
            background-color: #ffcccc;
            color: #ff0000;
        }

        .status-badge.on {
            background-color: #ccffcc;
            color: #008800;
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: 2px solid #000000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            background: #eeeeee;
            color: #000000;
        }

        .btn-start {
            background: #00ff00;
        }

        .btn-end {
            background: #ff0000;
            color: #ffffff;
        }

        .offers-section {
            margin-top: 20px;
            text-align: left;
            border-top: 2px solid #000000;
            padding-top: 15px;
        }

        .offers-section h2 {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .offers-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .offer-card {
            background: #ffffff;
            border: 2px solid #000000;
            padding: 12px;
        }

        .offer-details {
            margin-bottom: 12px;
        }

        .detail-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-icon {
            font-size: 1rem;
            line-height: 1;
        }

        .detail-label {
            font-weight: bold;
            color: #000000;
            min-width: 50px;
        }

        .detail-value {
            color: #000000;
        }

        .offer-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: 2px solid #000000;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            background: #eeeeee;
            color: #000000;
        }

        .btn-accept {
            background: #0000ff;
            color: #ffffff;
        }

        .btn-reject {
            background: #ff0000;
            color: #ffffff;
        }

        .empty-offers {
            text-align: center;
            color: #000000;
            padding: 15px;
            border: 2px dashed #000000;
            background: #ffffff;
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Status -->
        <div id="status-container">
            <div id="status-badge" class="status-badge off">
                <span class="dot"></span>
                <span id="status-text">Smena nije započeta</span>
            </div>
        </div>

        <div id="start-shift-view">
            <h1>Započni smenu</h1>
            <p class="subtitle">Aktivirajte smenu kako biste počeli da primate ponude za dostave.</p>
            <button class="btn btn-start" id="btn-start-shift">Započni smenu</button>
        </div>

        <div id="active-shift-view" class="hidden">
            <h1>Smena je aktivna</h1>
            <p class="subtitle">Dostupni ste na mapi i sistem vam može dodeliti nove porudžbine.</p>
            <button class="btn btn-end" id="btn-end-shift">Završi smenu</button>

            <!-- Map Section -->
            <div id="map-container" class="hidden" style="margin-top: 20px; text-align: left; border-top: 2px solid #000000; padding-top: 15px;">
                <h2 style="font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; color: #000000;">
                    Vaša lokacija
                </h2>
                <div id="map" style="height: 250px; width: 100%; border: 2px solid #000000;"></div>
                <div id="map-hint" style="color: #d97706; margin-top: 8px; font-size: 0.85rem; font-weight: bold;">
                    📍 Klikni na mapu da označiš svoju trenutnu lokaciju
                </div>
            </div>

            <!-- Offers Section -->
            <div class="offers-section">
                <h2>
                    Ponuđene dostave
                    <span id="offers-count" style="font-size: 0.9rem; background: #e2e8f0; padding: 4px 10px; border-radius: 9999px; font-weight: normal; color: #475569;">0</span>
                </h2>
                <div id="offers-list-container" class="offers-list">
                    <!-- Dynamic offers -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_USERS_URL = 'http://localhost:8000/api/delivery-subsystem/users';
        const API_DELIVERIES_URL = 'http://localhost:8000/api/delivery-subsystem/deliveries';

        let pollingInterval = null;
        let activeDeliveryId = null;  // ID prihvaćene dostave (ako postoji)
        let map = null;
        let courierMarker = null;

        function getToken() {
            return localStorage.getItem('jwt_token') || parent.localStorage.getItem('jwt_token');
        }

        function getUserId() {
            const token = getToken();
            return token ? getUserIdFromToken(token) : null;
        }

        function initMap() {
            const mapContainer = document.getElementById('map-container');
            mapContainer.classList.remove('hidden');
            if (!map) {
                map = L.map('map', { zoomControl: true }).setView([45.25, 19.83], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);

                map.on('click', function (e) {
                    placeCourierMarker(e.latlng.lat, e.latlng.lng, true);
                });
            } else {
                map.invalidateSize();
            }
        }

        function hideMap() {
            document.getElementById('map-container').classList.add('hidden');
        }

        function placeCourierMarker(lat, lon, fromClick = false) {
            const courierIcon = L.divIcon({
                className: '',
                html: `<div style="
                    background:#f59e0b;
                    width:18px;height:18px;border-radius:50%;
                    border:3px solid white;
                    box-shadow:0 2px 10px rgba(245,158,11,0.7);
                    animation:pulse-marker 1.5s infinite;
                "></div>
                <style>@keyframes pulse-marker{0%{transform:scale(1);}50%{transform:scale(1.3);}100%{transform:scale(1);}}</style>`,
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });

            if (courierMarker) {
                courierMarker.setLatLng([lat, lon]);
            } else {
                courierMarker = L.marker([lat, lon], { icon: courierIcon })
                    .bindPopup('<b>🛵 Ti si ovde</b>')
                    .addTo(map);
            }

            if (fromClick) {
                document.getElementById('map-hint').innerText = '📍 Lokacija zabeležena!';
                setTimeout(() => {
                    const hintEl = document.getElementById('map-hint');
                    if (hintEl) hintEl.innerText = '📍 Klikni na mapu da promeniš svoju lokaciju';
                }, 3000);
                saveLocationToServer(lat, lon);
            }
        }

        async function saveLocationToServer(lat, lon) {
            const userId = getUserId();
            if (!userId) return;
            try {
                await fetch(`${API_USERS_URL}/${userId}/location`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ lat, lon })
                });
            } catch (e) {
                console.warn('Greška pri čuvanju lokacije:', e);
            }
        }

        async function loadCourierLocation() {
            const userId = getUserId();
            if (!userId) return;
            try {
                const response = await fetch(`${API_USERS_URL}/${userId}/location`, {
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.lat && data.lon) {
                        placeCourierMarker(data.lat, data.lon, false);
                        if (map) {
                            map.setView([data.lat, data.lon], 14);
                        }
                    }
                }
            } catch (e) {
                console.warn('Greška pri učitavanju lokacije:', e);
            }
        }

        function getUserIdFromToken(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload).sub;
            } catch (e) {
                console.error("Greška pri dekodiranju tokena:", e);
                return null;
            }
        }

        async function initPage() {
            const token = localStorage.getItem('jwt_token') || parent.localStorage.getItem('jwt_token');
            if (!token) {
                alert('Niste prijavljeni! Preusmeravanje...');
                window.location.href = '/';
                return;
            }
            const userId = getUserIdFromToken(token);
            if (!userId) {
                alert('Nevalidna sesija!');
                return;
            }

            // Učitavanje korisničkog statusa
            try {
                const response = await fetch(`${API_USERS_URL}/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (response.status === 401) {
                    window.location.href = '/';
                    return;
                }
                if (response.ok) {
                    const user = await response.json();
                    
                    // Provera da li već postoji aktivna dostava za ovog kurira u bazi
                    const activeRes = await fetch(`${API_DELIVERIES_URL}/active`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (activeRes.status === 401) {
                        window.location.href = '/';
                        return;
                    }
                    if (activeRes.ok) {
                        const activeDel = await activeRes.json();
                        if (activeDel && activeDel.id) {
                            activeDeliveryId = activeDel.id;
                        }
                    }
                    
                    updateUI(user.is_available);
                } else {
                    console.error('Greška pri učitavanju profila.');
                }
            } catch (error) {
                console.error('Mrežna greška:', error);
            }
        }

        function updateUI(isAvailable) {
            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');
            const startView = document.getElementById('start-shift-view');
            const activeView = document.getElementById('active-shift-view');

            if (isAvailable || activeDeliveryId) {
                statusBadge.className = 'status-badge on';
                statusText.innerText = 'Na dužnosti';
                startView.classList.add('hidden');
                activeView.classList.remove('hidden');
                
                // Inicijalizuj mapu i učitaj sačuvanu lokaciju
                initMap();
                loadCourierLocation();

                // Pokretanje periodičnog osvežavanja ponuda
                fetchOffers();
                if (!pollingInterval) {
                    pollingInterval = setInterval(fetchOffers, 5000);
                }
            } else {
                statusBadge.className = 'status-badge off';
                statusText.innerText = 'Smena nije započeta';
                startView.classList.remove('hidden');
                activeView.classList.add('hidden');

                // Sakrij mapu
                hideMap();

                // Zaustavljanje osvežavanja
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
            }
        }

        async function fetchOffers() {
            const token = localStorage.getItem('jwt_token') || parent.localStorage.getItem('jwt_token');
            const container = document.getElementById('offers-list-container');
            const countBadge = document.getElementById('offers-count');

            try {
                // Proveri dinamički sa servera da li imamo aktivnu dostavu (prihvaćena ili u tranzitu)
                const activeRes = await fetch(`${API_DELIVERIES_URL}/active`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (activeRes.ok) {
                    const activeDel = await activeRes.json();
                    if (activeDel && activeDel.id) {
                        activeDeliveryId = activeDel.id;
                        
                        // Force showing the active view if we have an active delivery!
                        document.getElementById('start-shift-view').classList.add('hidden');
                        document.getElementById('active-shift-view').classList.remove('hidden');
                        document.getElementById('status-badge').className = 'status-badge on';
                        document.getElementById('status-text').innerText = 'Na dužnosti';
                        
                        initMap();
                        loadCourierLocation();

                        showActiveDeliveryBanner(activeDeliveryId);
                        return;
                    } else {
                        activeDeliveryId = null;
                    }
                }
            } catch (err) {
                console.warn('Greška pri proveri aktivne dostave:', err);
            }

            try {
                const response = await fetch(`${API_DELIVERIES_URL}/offers`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (response.ok) {
                    const offers = await response.json();
                    countBadge.innerText = offers.length;
                    
                    if (offers.length === 0) {
                        container.innerHTML = `<div class="empty-offers">Trenutno nema novih ponuda. Ostanite na liniji!</div>`;
                        return;
                    }

                    container.innerHTML = offers.map(offer => `
                        <div class="offer-card" id="offer-${offer.id}">
                            <div class="offer-details">
                                <div class="detail-row">
                                    <span class="detail-icon">📍</span>
                                    <span class="detail-label">Od:</span>
                                    <span class="detail-value">${offer.from_location || '—'}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-icon">🏁</span>
                                    <span class="detail-label">Do:</span>
                                    <span class="detail-value">${offer.to_location || '—'}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-icon">📦</span>
                                    <span class="detail-label">ID:</span>
                                    <span class="detail-value" style="font-family: monospace; font-size: 0.85rem;">${offer.id}</span>
                                </div>
                            </div>
                            <div class="offer-actions">
                                <a href="/courier/dostava.html?id=${offer.id}" class="btn-action btn-accept" style="text-decoration:none; text-align:center;">Vidi još</a>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Greška pri dobavljanju ponuda:', error);
            }
        }

        function showActiveDeliveryBanner(deliveryId) {
            const container = document.getElementById('offers-list-container');
            const countBadge = document.getElementById('offers-count');
            countBadge.innerText = '✓';
            container.innerHTML = `
                <div class="offer-card" style="border-color: #10b981; background: rgba(16,185,129,0.05);">
                    <div class="offer-details">
                        <div class="detail-row">
                            <span class="detail-icon">🟢</span>
                            <span class="detail-label" style="color:#10b981; font-weight:700;">Aktivna dostava</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-icon">📦</span>
                            <span class="detail-label">ID:</span>
                            <span class="detail-value" style="font-family: monospace; font-size: 0.85rem;">${deliveryId}</span>
                        </div>
                    </div>
                    <div class="offer-actions">
                        <a href="/courier/dostava.html?id=${deliveryId}" class="btn-action btn-accept" style="text-decoration:none; text-align:center;">
                            🗺️ Nastavi
                        </a>
                    </div>
                </div>
            `;
        }

        async function acceptOffer(deliveryId) {
            const token = localStorage.getItem('jwt_token') || parent.localStorage.getItem('jwt_token');
            const userId = getUserIdFromToken(token);

            try {
                const response = await fetch(`${API_DELIVERIES_URL}/${deliveryId}/accept`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: userId })
                });
                const result = await response.json();
                if (response.ok) {
                    // Zaustavi polling ponuda, prikaži "Nastavi" dugme
                    if (pollingInterval) {
                        clearInterval(pollingInterval);
                        pollingInterval = null;
                    }
                    activeDeliveryId = deliveryId;
                    showActiveDeliveryBanner(deliveryId);
                } else {
                    alert('Greška: ' + (result.error || 'Nije moguće prihvatiti dostavu.'));
                }
            } catch (error) {
                console.error('Greška:', error);
            }
        }

        async function rejectOffer(deliveryId) {
            const token = localStorage.getItem('jwt_token') || parent.localStorage.getItem('jwt_token');
            const userId = getUserIdFromToken(token);

            try {
                const response = await fetch(`${API_DELIVERIES_URL}/${deliveryId}/reject`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ courier_id: userId })
                });
                const result = await response.json();
                if (response.ok) {
                    alert('Ponuda je odbijena.');
                    fetchOffers();
                } else {
                    alert('Greška: ' + (result.error || 'Nije moguće odbiti ponudu.'));
                }
            } catch (error) {
                console.error('Greška:', error);
            }
        }

        // Start Shift
        document.getElementById('btn-start-shift').addEventListener('click', async () => {
            const token = localStorage.getItem('jwt_token') || parent.localStorage.getItem('jwt_token');
            const userId = getUserIdFromToken(token);

            try {
                const response = await fetch(`${API_USERS_URL}/${userId}/start_shift`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (response.ok) {
                    updateUI(true);
                } else {
                    const result = await response.json();
                    alert('Greška: ' + (result.error || 'Nije moguće započeti smenu.'));
                }
            } catch (error) {
                console.error('Greška:', error);
            }
        });

        // End Shift
        document.getElementById('btn-end-shift').addEventListener('click', async () => {
            const token = localStorage.getItem('jwt_token') || parent.localStorage.getItem('jwt_token');
            const userId = getUserIdFromToken(token);

            try {
                const response = await fetch(`${API_USERS_URL}/${userId}/end_shift`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (response.ok) {
                    updateUI(false);
                } else {
                    const result = await response.json();
                    alert('Greška: ' + (result.error || 'Nije moguće završiti smenu.'));
                }
            } catch (error) {
                console.error('Greška:', error);
            }
        });

        // Inicijalizacija pri učitavanju
        window.addEventListener('load', initPage);
    </script>
</body>

</html>
