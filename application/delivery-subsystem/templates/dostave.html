<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dostave</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            /* Osnovni, čitljiv font */
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            /* Centriran naslov gore */
            margin-bottom: 40px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            /* Gura pretragu skroz levo, a dugme skroz desno */
            align-items: center;
            margin-bottom: 15px;
        }

        .search-box {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }


        .search-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-advanced {
            padding: 10px 15px;
            background-color: #007bff;
            /* Plava boja za naprednu pretragu */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-advanced:hover {
            background-color: #0056b3;
        }

        .btn-add {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-add:hover {
            background-color: #218838;
        }

        .btn-edit {
            padding: 5px 10px;
            background-color: #ffc107;
            color: black;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-edit:hover {
            background-color: #e0a800;
        }

        .btn-delete {
            padding: 5px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #28a745;
            /* Zelena boja kada je uključen */
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            /* Spaja ivice ćelija */
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            /* Blago siva pozadina zaglavlja tabele */
            font-weight: bold;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable::after {
            content: '\2195';
            /* Neutralna strelica (gore-dole) */
            margin-left: 5px;
            opacity: 0.3;
        }

        th.sortable.asc::after {
            content: '\2191';
            /* Strelica nagore */
            opacity: 1;
        }

        th.sortable.desc::after {
            content: '\2193';
            /* Strelica nadole */
            opacity: 1;
        }

        th.sortable:hover {
            background-color: #e2e6ea;
        }

        tr:hover {
            background-color: #f1f1f1;
            /* Hover efekat prilikom prelaska miša preko reda */
        }
    </style>
</head>

<body>

    <h1>Dostave</h1>

    <div class="controls">
        <div class="search-group">
            <input type="text" class="search-box" placeholder="Pretraži id dostave...">
            <button class="btn-advanced">Napredna pretraga</button>
        </div>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div class="toggle-container">
                <span>Aktivne dostave</span>
                <label class="switch">
                    <input type="checkbox" id="active-deliveries-toggle"> <!-- Isključen po defaultu (nema checked) -->
                    <span class="slider"></span>
                </label>
            </div>
            <button class="btn-add" onclick="addDelivery()">+ Kreiraj dostavu</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th class="sortable" title="Klikni za sortiranje">ID</th>
                <th class="sortable" title="Klikni za sortiranje">Od (Restoran)</th>
                <th class="sortable" title="Klikni za sortiranje">Do (Kupac)</th>
                <th class="sortable" title="Klikni za sortiranje">Dostavljač</th>
                <th class="sortable" title="Klikni za sortiranje">Vreme početka</th>
                <th class="sortable" title="Klikni za sortiranje">Vreme preuzimanja</th>
                <th class="sortable" title="Klikni za sortiranje">Vreme dostavljanja</th>
                <th class="sortable" title="Klikni za sortiranje">Status</th>
                <th class="sortable" title="Klikni za sortiranje">Ocena</th>
                <th>Akcije</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dinamički podaci iz baze -->
        </tbody>
    </table>

    <script>
        const API_BASE_DELIVERIES = 'http://localhost:8000/api/delivery-subsystem/deliveries';

        async function loadDeliveries() {
            try {
                const response = await fetch(API_BASE_DELIVERIES + '/');
                const data = await response.json();
                const tbody = document.querySelector('tbody');
                const activeOnly = document.getElementById('active-deliveries-toggle').checked;

                tbody.innerHTML = '';

                if (Array.isArray(data)) {
                    data.forEach(delivery => {
                        // Preskoči završene/otkazane dostave ako je uključen switch za 'Aktivne'
                        if (activeOnly && (delivery.status === 'completed' || delivery.status === 'cancelled')) return;

                        const tr = document.createElement('tr');
                        const fmtTime = (t) => t && t !== 'None' ? t.replace('T', ' ').substring(0, 16) : '/';

                        tr.innerHTML = `
                            <td>${delivery.id}</td>
                            <td>${delivery.from_location || '/'}</td>
                            <td>${delivery.to_location || '/'}</td>
                            <td>${delivery.courier || 'Nije dodeljen'}</td>
                            <td>${fmtTime(delivery.start_time)}</td>
                            <td>${fmtTime(delivery.pickup_time)}</td>
                            <td>${fmtTime(delivery.delivery_time)}</td>
                            <td><strong>${delivery.status}</strong></td>
                            <td>${delivery.rating || '/'}</td>
                            <td>
                                <button class="btn-edit" onclick="editDelivery('${delivery.id}')">Izmeni</button>
                                <button class="btn-delete" onclick="deleteDelivery('${delivery.id}')">Obriši</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Greška pri učitavanju dostava:', error);
            }
        }

        async function addDelivery() {
            const id = prompt('Unesite ID dostave (npr. del-10):');
            if (!id) return;
            const from_location = prompt('Unesite lokaciju preuzimanja (Restoran):');
            const to_location = prompt('Unesite lokaciju dostave (Kupac):');
            const status = prompt('Unesite status (pending, in_transit, completed...):', 'pending');

            const order_time = new Date().toISOString();
            const payload = { id, status, from_location, to_location, order_time, rating: 0 };

            try {
                await fetch(API_BASE_DELIVERIES + '/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                loadDeliveries();
            } catch (e) { console.error(e); }
        }

        async function deleteDelivery(id) {
            if (!confirm('Da li ste sigurni da želite da obrišete ovu dostavu?')) return;
            try {
                await fetch(`${API_BASE_DELIVERIES}/${id}`, { method: 'DELETE' });
                loadDeliveries();
            } catch (e) { console.error(e); }
        }

        async function editDelivery(id) {
            const from_location = prompt('Unesite novu lokaciju preuzimanja (Restoran):');
            if (!from_location) return;
            const to_location = prompt('Unesite novu lokaciju dostave (Kupac):');
            const status = prompt('Unesite novi status:', 'pending');
            const rating = prompt('Unesite ocenu (1-5):', '0');

            const payload = { status, from_location, to_location, rating: parseInt(rating) || 0 };

            try {
                await fetch(`${API_BASE_DELIVERIES}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                loadDeliveries();
            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDeliveries(); // Inicijalno učitavanje

            // Osvežavanje podataka prilikom klika na toggle 'Aktivne dostave'
            document.getElementById('active-deliveries-toggle').addEventListener('change', loadDeliveries);

            document.querySelectorAll('th.sortable').forEach(th => {
                let asc = true;
                th.addEventListener('click', () => {
                    const table = th.closest('table');
                    const tbody = table.querySelector('tbody');
                    const index = Array.from(th.parentNode.children).indexOf(th);

                    // Resetovanje indikatora na ostalim kolonama
                    table.querySelectorAll('th.sortable').forEach(header => {
                        if (header !== th) header.classList.remove('asc', 'desc');
                    });

                    // Postavljanje indikatora na trenutnoj koloni
                    if (asc) {
                        th.classList.remove('desc');
                        th.classList.add('asc');
                    } else {
                        th.classList.remove('asc');
                        th.classList.add('desc');
                    }

                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    rows.sort((a, b) => {
                        const valA = a.children[index].innerText.trim();
                        const valB = b.children[index].innerText.trim();

                        // Provera da li je broj
                        if (!isNaN(valA) && !isNaN(valB) && valA !== '' && valB !== '') {
                            return asc ? valA - valB : valB - valA;
                        } else {
                            return asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                        }
                    });

                    asc = !asc;
                    rows.forEach(tr => tbody.appendChild(tr));
                });
            });
        });
    </script>
</body>

</html>
