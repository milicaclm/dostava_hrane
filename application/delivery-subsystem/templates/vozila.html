<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vozila</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            /* Osnovni, čitljiv font */
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            /* Centriran naslov gore */
            margin-bottom: 40px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            /* Gura pretragu skroz levo, a dugme skroz desno */
            align-items: center;
            margin-bottom: 15px;
        }

        .search-box {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .search-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-advanced {
            padding: 10px 15px;
            background-color: #007bff;
            /* Plava boja za naprednu pretragu */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-advanced:hover {
            background-color: #0056b3;
        }

        .btn-add {
            padding: 10px 20px;
            background-color: #28a745;
            /* Zelena boja za akciju dodavanja */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-add:hover {
            background-color: #218838;
        }

        .btn-edit {
            padding: 5px 10px;
            background-color: #ffc107;
            color: black;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-edit:hover { background-color: #e0a800; }

        .btn-delete {
            padding: 5px 10px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-delete:hover { background-color: #c82333; }

        table {
            width: 100%;
            border-collapse: collapse;
            /* Spaja ivice ćelija */
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            /* Blago siva pozadina zaglavlja tabele */
            font-weight: bold;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable::after {
            content: '\2195';
            /* Neutralna strelica (gore-dole) */
            margin-left: 5px;
            opacity: 0.3;
        }

        th.sortable.asc::after {
            content: '\2191';
            /* Strelica nagore */
            opacity: 1;
        }

        th.sortable.desc::after {
            content: '\2193';
            /* Strelica nadole */
            opacity: 1;
        }

        th.sortable:hover {
            background-color: #e2e6ea;
        }

        tr:hover {
            background-color: #f1f1f1;
            /* Hover efekat prilikom prelaska miša preko reda */
        }
    </style>
</head>

<body>

    <h1>Vozila</h1>

    <div class="controls">
        <div class="search-group">
            <input type="text" class="search-box" placeholder="Pretraži vozila po oznaci...">
            <button class="btn-advanced">Napredna pretraga</button>
        </div>
        <button class="btn-add" onclick="addVehicle()">+ Dodaj vozilo</button>
    </div>

    <table>
        <thead>
            <tr>
                <th class="sortable" title="Klikni za sortiranje">Vlasnik ID</th>
                <th class="sortable" title="Klikni za sortiranje">Registarska oznaka</th>
                <th class="sortable" title="Klikni za sortiranje">Tip</th>
                <th class="sortable" title="Klikni za sortiranje">Model</th>
                <th class="sortable" title="Klikni za sortiranje">Marka</th>
                <th class="sortable" title="Klikni za sortiranje">Boja</th>
                <th class="sortable" title="Klikni za sortiranje">Spreman</th>
                <th class="sortable" title="Klikni za sortiranje">Zauzeto</th>
                <th>Akcije</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dinamički podaci iz baze -->
        </tbody>
    </table>

    <script>
        const API_BASE_VEHICLES = 'http://localhost:8000/api/delivery-subsystem/vehicles';

        async function loadVehicles() {
            try {
                const response = await fetch(API_BASE_VEHICLES);
                const data = await response.json();
                const tbody = document.querySelector('tbody');
                tbody.innerHTML = '';
                
                if (data.vehicles) {
                    data.vehicles.forEach(vehicle => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${vehicle.owner_id || '/'}</td>
                            <td>${vehicle.license_plate}</td>
                            <td>${vehicle.type}</td>
                            <td>${vehicle.model || ''}</td>
                            <td>${vehicle.brand || ''}</td>
                            <td>${vehicle.color || ''}</td>
                            <td>${vehicle.is_ready ? 'Da' : 'Ne'}</td>
                            <td>${vehicle.in_use ? 'Da' : 'Ne'}</td>
                            <td>
                                <button class="btn-edit" onclick="editVehicle('${vehicle.license_plate}')">Izmeni</button>
                                <button class="btn-delete" onclick="deleteVehicle('${vehicle.license_plate}')">Obriši</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Greška pri učitavanju vozila:', error);
            }
        }

        async function addVehicle() {
            const owner_id = prompt('Unesite ID vlasnika (opciono):') || null;
            const license_plate = prompt('Unesite registraciju (npr. BG-1234):');
            if (!license_plate) return;
            const type = prompt('Unesite tip (bike, car):');
            const brand = prompt('Unesite marku:');
            const model = prompt('Unesite model:');
            const color = prompt('Unesite boju:');
            
            const payload = { owner_id, license_plate, type, brand, model, color, is_ready: true, description: '' };
            
            try {
                await fetch(API_BASE_VEHICLES, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                loadVehicles();
            } catch (e) { console.error(e); }
        }

        async function deleteVehicle(licensePlate) {
            if (!confirm('Da li ste sigurni da želite da obrišete ovo vozilo?')) return;
            try {
                await fetch(`${API_BASE_VEHICLES}/${licensePlate}`, { method: 'DELETE' });
                loadVehicles();
            } catch (e) { console.error(e); }
        }

        async function editVehicle(licensePlate) {
            const owner_id = prompt('Unesite novi ID vlasnika (opciono):') || null;
            const type = prompt('Unesite novi tip (bike, car):');
            if (!type) return;
            const brand = prompt('Unesite novu marku:');
            const model = prompt('Unesite novi model:');
            const color = prompt('Unesite novu boju:');
            
            const payload = { owner_id, type, brand, model, color, is_ready: true, description: '' };
            
            try {
                await fetch(`${API_BASE_VEHICLES}/${licensePlate}/update`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                loadVehicles();
            } catch (e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadVehicles(); // Učitavanje odmah na startu

            document.querySelectorAll('th.sortable').forEach(th => {
                let asc = true;
                th.addEventListener('click', () => {
                    const table = th.closest('table');
                    const tbody = table.querySelector('tbody');
                    const index = Array.from(th.parentNode.children).indexOf(th);

                    // Resetovanje indikatora na ostalim kolonama
                    table.querySelectorAll('th.sortable').forEach(header => {
                        if (header !== th) header.classList.remove('asc', 'desc');
                    });

                    // Postavljanje indikatora na trenutnoj koloni
                    if (asc) {
                        th.classList.remove('desc');
                        th.classList.add('asc');
                    } else {
                        th.classList.remove('asc');
                        th.classList.add('desc');
                    }

                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    rows.sort((a, b) => {
                        const valA = a.children[index].innerText.trim();
                        const valB = b.children[index].innerText.trim();

                        // Provera da li je broj
                        if (!isNaN(valA) && !isNaN(valB) && valA !== '' && valB !== '') {
                            return asc ? valA - valB : valB - valA;
                        } else {
                            return asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                        }
                    });

                    asc = !asc;
                    rows.forEach(tr => tbody.appendChild(tr));
                });
            });
        });
    </script>
</body>

</html>
