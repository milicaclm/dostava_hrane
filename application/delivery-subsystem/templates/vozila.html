<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vozila</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            /* Osnovni, čitljiv font */
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            /* Centriran naslov gore */
            margin-bottom: 40px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            /* Gura pretragu skroz levo, a dugme skroz desno */
            align-items: center;
            margin-bottom: 15px;
        }

        .search-box {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn-add {
            padding: 10px 20px;
            background-color: #28a745;
            /* Zelena boja za akciju dodavanja */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-add:hover {
            background-color: #218838;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            /* Spaja ivice ćelija */
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            /* Blago siva pozadina zaglavlja tabele */
            font-weight: bold;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable::after {
            content: '\2195'; /* Neutralna strelica (gore-dole) */
            margin-left: 5px;
            opacity: 0.3;
        }

        th.sortable.asc::after {
            content: '\2191'; /* Strelica nagore */
            opacity: 1;
        }

        th.sortable.desc::after {
            content: '\2193'; /* Strelica nadole */
            opacity: 1;
        }

        th.sortable:hover {
            background-color: #e2e6ea;
        }

        tr:hover {
            background-color: #f1f1f1;
            /* Hover efekat prilikom prelaska miša preko reda */
        }
    </style>
</head>

<body>

    <h1>Vozila</h1>

    <div class="controls">
        <input type="text" class="search-box" placeholder="Pretraži vozila po oznaci...">
        <button class="btn-add">+ Dodaj vozilo</button>
    </div>

    <table>
        <thead>
            <tr>
                <th class="sortable" title="Klikni za sortiranje">Registarska oznaka</th>
                <th class="sortable" title="Klikni za sortiranje">Tip</th>
                <th class="sortable" title="Klikni za sortiranje">Spreman</th>
                <th>Akcije</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>BG-123-AB</td>
                <td>Automobil</td>
                <td>DA</td>
                <td><a href="#">Izmeni</a> | <a href="#">Obriši</a></td>
            </tr>
            <tr>
                <td>NS-456-CD</td>
                <td>Skuter</td>
                <td>NE</td>
                <td><a href="#">Izmeni</a> | <a href="#">Obriši</a></td>
            </tr>
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('th.sortable').forEach(th => {
                let asc = true;
                th.addEventListener('click', () => {
                    const table = th.closest('table');
                    const tbody = table.querySelector('tbody');
                    const index = Array.from(th.parentNode.children).indexOf(th);

                    // Resetovanje indikatora na ostalim kolonama
                    table.querySelectorAll('th.sortable').forEach(header => {
                        if (header !== th) header.classList.remove('asc', 'desc');
                    });

                    // Postavljanje indikatora na trenutnoj koloni
                    if (asc) {
                        th.classList.remove('desc');
                        th.classList.add('asc');
                    } else {
                        th.classList.remove('asc');
                        th.classList.add('desc');
                    }

                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    rows.sort((a, b) => {
                        const valA = a.children[index].innerText.trim();
                        const valB = b.children[index].innerText.trim();

                        // Provera da li je broj
                        if (!isNaN(valA) && !isNaN(valB) && valA !== '' && valB !== '') {
                            return asc ? valA - valB : valB - valA;
                        } else {
                            return asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                        }
                    });

                    asc = !asc;
                    rows.forEach(tr => tbody.appendChild(tr));
                });
            });
        });
    </script>
</body>

</html>
