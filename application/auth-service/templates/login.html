<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava</title>
    <style>
        body { font-family: sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #fff; color: #000; }
        .box { width: 300px; padding: 20px; border: 1px solid #000; }
        h1 { margin: 0 0 16px 0; font-size: 1.5rem; text-align: center; }
        .field { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 8px; border: 1px solid #000; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #fff; color: #000; border: 1px solid #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #eee; }
        .error { margin-top: 12px; color: #b00; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Prijava</h1>
        <form method="POST" action="/">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
                <label for="password">Lozinka</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Prijavi se</button>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
        </form>
    </div>
</body>
</html>
