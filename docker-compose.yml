volumes:
  neo4j_data:
    driver: local
  influxdb2-data:
    driver: local
  redis-data:
    driver: local

services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    restart: on-failure
    ports:
      - "7474:7474" # vizuelni interfejs
      - "7687:7687" # Flask
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

  influxdb2:
    image: influxdb:2.7.6
    ports:
      - '8086:8086'
    volumes:
      - influxdb2-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=superpassword
      - DOCKER_INFLUXDB_INIT_ORG=docs
      - DOCKER_INFLUXDB_INIT_BUCKET=home
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mytoken123

  redisdb:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  redis-insight:
    image: redislabs/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redisdb
    environment:
      - REDIS_HOST=redisdb
      - REDIS_PORT=6379

  delivery-subsystem:
    build: ./application/delivery-subsystem/backend
    restart: on-failure
    volumes:
      - ./application/delivery-subsystem:/app
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_HOST=redisdb
      - REDIS_PORT=6379
      - INFLUXDB_URL=http://influxdb2:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=superpassword
      - INFLUXDB_TOKEN=mytoken123
      - INFLUXDB_ORG=docs
      - INFLUXDB_BUCKET=geo_data
      - INTERNAL_API_URL=http://localhost:8080
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
    command: flask run --host=0.0.0.0 --port=8080
    depends_on:
      - neo4j
      - influxdb2
      - redisdb
      - redis-insight

  gateway:
    build: ./gateway
    restart: on-failure
    volumes:
      - ./gateway:/app
    ports:
      - "8000:8080"
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
    command: flask run --host=0.0.0.0 --port=8080
    depends_on:
      - delivery-subsystem
