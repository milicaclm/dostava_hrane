volumes:
  neo4j_data:
    driver: local
  influxdb2-data:
    driver: local
  redis-data:
    driver: local

services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    restart: on-failure
    ports:
      - "7474:7474" # vizuelni interfejs
      - "7687:7687" # Flask
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

  influxdb2:
    image: influxdb:2.7.6
    ports:
      - '8086:8086'
    volumes:
      - influxdb2-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=superpassword
      - DOCKER_INFLUXDB_INIT_ORG=docs
      - DOCKER_INFLUXDB_INIT_BUCKET=home
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mytoken123

  redisdb:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  redis-insight:
    image: redislabs/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redisdb
    environment:
      - REDIS_HOST=redisdb
      - REDIS_PORT=6379
  
  user-service:
    build: ./backend/user-service
    restart: on-failure
    volumes:
      - ./backend/model.py:/dostava/model.py
    ports:
      - "8081:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j

  resource-service:
    build: ./backend/resource-service
    restart: on-failure
    volumes:
      - ./backend/model.py:/dostava/model.py
    ports:
      - "8082:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j

  delivery-service:
    build: ./backend/delivery-service
    restart: on-failure
    volumes:
      - ./backend/model.py:/dostava/model.py
    ports:
      - "8083:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_HOST=redisdb
      - REDIS_PORT=6379
    depends_on:
      - neo4j
      - redisdb
  
  location-service:
    build: ./backend/location-service
    restart: on-failure
    ports:
      - "8084:8080"
    environment:
      - INFLUXDB_URL=http://influxdb2:8086
      - INFLUXDB_TOKEN=mytoken123
      - INFLUXDB_ORG=docs
      - INFLUXDB_BUCKET=home
      - REDIS_HOST=redisdb
      - REDIS_PORT=6379
    depends_on:
      - influxdb2
      - redisdb

  analitics-service:
    build: ./backend/analitics-service
    restart: on-failure
    ports:
      - "8085:8080"
    environment:
      - INFLUXDB_URL=http://influxdb2:8086
      - INFLUXDB_TOKEN=mytoken123
      - INFLUXDB_ORG=docs
      - INFLUXDB_BUCKET=home
    depends_on:
      - influxdb2

  gateway:
    build: ./backend/gateway
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - resource-service
      - delivery-service
      - location-service
      - analitics-service
