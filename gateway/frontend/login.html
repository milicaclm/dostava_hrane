<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* ... Svi stilovi ostaju unutra za svaki slučaj ... */
    </style>
</head>
<body>
    <div class="content-block">
        <h1>Prijava</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Lozinka</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Prijavi se</button>
            <p id="message" class="message"></p>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageElement = document.getElementById('message');
            const loginUrl = '/api/auth-service/auth/login';

            try {
                const response = await fetch(loginUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('jwt_token', data.access_token);
                    const payload = JSON.parse(atob(data.access_token.split('.')[1]));
                    const userType = payload.account_type;
                    messageElement.textContent = 'Uspešna prijava! Preusmeravanje...';
                    messageElement.style.color = 'green';

                    if (userType === 'manager') {
                        window.location.href = '/manager/templates/index.html';
                    } else if (userType === 'courier') {
                        window.location.href = '/courier/templates/index.html';
                    } else {
                        messageElement.textContent = 'Tip naloga nije podržan.';
                        messageElement.style.color = 'orange';
                    }
                } else {
                    messageElement.textContent = data.error || 'Prijava nije uspela.';
                    messageElement.style.color = 'red';
                }
            } catch (error) {
                console.error('Greška:', error);
                messageElement.textContent = 'Došlo je do greške. Proverite konekciju.';
                messageElement.style.color = 'red';
            }
        });
    </script>
</body>
</html>
